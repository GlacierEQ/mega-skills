name: Validate Mega Skills Hierarchy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  private-self-hosted-full:
    runs-on: [self-hosted, mega-skills, macos-x64]
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Execute proven full validation contract
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "VALIDATION_SHA=$actual"
          python3 --version
          python3 -m compileall -q scripts tests skills
          python3 scripts/validate_hierarchy.py
          python3 scripts/validate_genius_mastery_bridge.py --mode freshness
          python3 scripts/generate_mega_skill_pyramids.py --check
          python3 -m unittest discover -s tests -v
          python3 skills/local-skill/tests/test_local_skill.py -v
          python3 skills/branch-lifecycle-intelligence/tests/test_branch_lifecycle.py -v
          export RUN_DIR=/tmp/mega-skills-github-actions-run
          rm -rf "$RUN_DIR"
          python3 scripts/run_mega_mission.py --output-dir "$RUN_DIR"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          run_dir = Path(os.environ["RUN_DIR"])
          receipt = json.loads((run_dir / "RUN_RECEIPT.json").read_text(encoding="utf-8"))
          assert receipt["status"] == "SUPPORT_VERIFIED"
          assert receipt["mission_state_changed"] is False
          assert receipt["completion_eligible"] is False
          assert receipt["support_only"] is True
          manifest = receipt["output_manifest"]
          canonical = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == receipt["output_manifest_sha256"]
          for item in manifest:
              path = run_dir / item["path"]
              assert path.is_file(), item["path"]
              assert path.stat().st_size == item["bytes"], item["path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"], item["path"]
          print(f"Verified {len(manifest)} receipt-manifest entries and their SHA-256 hashes.")
          PY
          TRANSIENT_RECEIPT=evidence/casebuilding-activation/test-dry-run-receipt.json
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -v '^$' | grep -v "^${TRANSIENT_RECEIPT}$" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked mutations after validation:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if ! git diff --quiet -- "$TRANSIENT_RECEIPT"; then
            git checkout -- "$TRANSIENT_RECEIPT"
          fi
          git diff --exit-code
          echo "MEGA_SKILLS_CANONICAL_SELF_HOSTED_VALIDATION=PASS"

  compile:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m compileall -q scripts tests skills

  hierarchy:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python scripts/validate_hierarchy.py

  genius-bridge:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python scripts/validate_genius_mastery_bridge.py --mode freshness

  pyramids:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python scripts/generate_mega_skill_pyramids.py --check

  regression:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  local-skill:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python skills/local-skill/tests/test_local_skill.py -v

  branch-lifecycle:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python skills/branch-lifecycle-intelligence/tests/test_branch_lifecycle.py -v

  validate:
    if: always()
    runs-on: [self-hosted, mega-skills, macos-x64]
    needs: [private-self-hosted-full, compile, hierarchy, genius-bridge, pyramids, regression, local-skill, branch-lifecycle]
    steps:
      - name: Require canonical private validation and report hosted probes
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          canonical = needs["private-self-hosted-full"].get("result")
          hosted = {name: data.get("result") for name, data in needs.items() if name != "private-self-hosted-full"}
          print("Hosted probe results:", json.dumps(hosted, sort_keys=True))
          if canonical != "success":
              print("Canonical private validation failed:", canonical)
              sys.exit(1)
          print("Canonical private self-hosted validation succeeded.")
          PY

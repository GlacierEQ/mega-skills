name: Validate Mega Skills Hierarchy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate capability hierarchy
        run: python scripts/validate_hierarchy.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

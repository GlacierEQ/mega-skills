steps:
  - label: ":python: Mega Skills contract validation"
    timeout_in_minutes: 10
    command: |
      set -eu
      python3 --version
      python3 scripts/validate_hierarchy.py
      python3 -m unittest discover -s tests -v
      python3 -m compileall -q scripts tests
      export RUN_DIR=/tmp/mega-skills-buildkite-run
      rm -rf "$$RUN_DIR"
      python3 scripts/run_mega_mission.py --output-dir "$$RUN_DIR"
      python3 - <<'PY'
      import hashlib
      import json
      import os
      from pathlib import Path

      run_dir = Path(os.environ["RUN_DIR"])
      receipt = json.loads((run_dir / "RUN_RECEIPT.json").read_text(encoding="utf-8"))
      assert receipt["status"] == "COMPLETED"
      manifest = receipt["output_manifest"]
      canonical = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode("utf-8")
      assert hashlib.sha256(canonical).hexdigest() == receipt["output_manifest_sha256"]
      for item in manifest:
          path = run_dir / item["path"]
          assert path.is_file(), item["path"]
          assert path.stat().st_size == item["bytes"], item["path"]
          assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"], item["path"]
      print(f"Verified {len(manifest)} receipt-manifest entries and their SHA-256 hashes.")
      PY
    artifact_paths:
      - "/tmp/mega-skills-buildkite-run/**/*"

  - label: ":compass: Harmonious Merge Watch (read-only)"
    key: "harmonious-merge-watch"
    timeout_in_minutes: 10
    command: |
      set -euo pipefail
      git fetch --quiet --prune origin \
        '+refs/heads/*:refs/remotes/origin/*' \
        '+refs/tags/*:refs/tags/*'
      python3 scripts/harmonious_merge_watch.py \
        --baseline main \
        --output .verification-artifacts/harmonious-merge-watch.json
      python3 - <<'PY'
      import json
      from pathlib import Path

      receipt = json.loads(Path(".verification-artifacts/harmonious-merge-watch.json").read_text())
      assert receipt["schema"] == "glaciereq.harmonious-merge-watch.v1"
      assert receipt["mode"] == "read_only"
      assert all(value is False for value in receipt["enforcement"].values() if isinstance(value, bool))
      assert receipt["baseline"]["name"] == "main"
      print("Verified read-only Harmonious Merge Watch receipt.")
      PY
    artifact_paths:
      - ".verification-artifacts/harmonious-merge-watch.json"

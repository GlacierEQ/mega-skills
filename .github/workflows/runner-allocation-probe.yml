name: Runner Allocation Probe

on:
  push:
    paths:
      - '.github/workflows/runner-allocation-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self_hosted_mega_skills:
    runs-on: [self-hosted, mega-skills, macos-x64]
    timeout-minutes: 2
    steps:
      - name: allocation-marker
        run: |
          echo runner-assigned-self-hosted-mega-skills
          uname -m

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: allocation-marker
        run: echo runner-assigned-ubuntu
  macos:
    runs-on: macos-latest
    timeout-minutes: 1
    steps:
      - name: allocation-marker
        run: echo runner-assigned-macos
  windows:
    runs-on: windows-latest
    timeout-minutes: 1
    steps:
      - name: allocation-marker
        run: echo runner-assigned-windows

name: Mega-Skills Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/validate_site.py"
      - ".github/workflows/mega-skills-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mega-skills-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Mega-Skills site
        run: python scripts/validate_site.py

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

steps:
  - label: ":python: Mega Skills full validation parity"
    key: "mega-skills-contract"
    timeout_in_minutes: 15
    command: |
      set -euo pipefail
      mkdir -p artifacts/buildkite
      actual="$(git rev-parse HEAD)"
      test "$$actual" = "$BUILDKITE_COMMIT"
      python3 --version
      python3 -m compileall -q scripts tests skills
      python3 scripts/validate_hierarchy.py
      python3 scripts/validate_genius_mastery_bridge.py --mode freshness
      python3 scripts/validate_deep_progress_latest.py
      python3 scripts/renew_proof_leases.py --check --renew-within-hours 2
      python3 scripts/generate_mega_skill_pyramids.py --check
      python3 -m unittest discover -s tests -v
      python3 skills/local-skill/tests/test_local_skill.py -v
      python3 skills/branch-lifecycle-intelligence/tests/test_branch_lifecycle.py -v
      export RUN_DIR=/tmp/mega-skills-buildkite-run
      rm -rf "$$RUN_DIR"
      python3 scripts/run_mega_mission.py --output-dir "$$RUN_DIR"
      python3 - <<'PY'
      import hashlib
      import json
      import os
      from pathlib import Path

      run_dir = Path(os.environ["RUN_DIR"])
      receipt = json.loads((run_dir / "RUN_RECEIPT.json").read_text(encoding="utf-8"))
      assert receipt["status"] == "SUPPORT_VERIFIED"
      assert receipt["mission_state_changed"] is False
      assert receipt["completion_eligible"] is False
      assert receipt["support_only"] is True
      manifest = receipt["output_manifest"]
      canonical = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode("utf-8")
      assert hashlib.sha256(canonical).hexdigest() == receipt["output_manifest_sha256"]
      for item in manifest:
          path = run_dir / item["path"]
          assert path.is_file(), item["path"]
          assert path.stat().st_size == item["bytes"], item["path"]
          assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"], item["path"]
      print(f"Verified {len(manifest)} receipt-manifest entries and their SHA-256 hashes.")
      PY
      python3 - <<'PY' > artifacts/buildkite/mega-skills-ci-receipt.json
      import datetime
      import json
      import os
      import subprocess

      receipt = {
          "schema": "glaciereq.mega-skills.buildkite-ci.v1",
          "status": "PASS",
          "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
          "branch": os.environ.get("BUILDKITE_BRANCH"),
          "build_id": os.environ.get("BUILDKITE_BUILD_ID"),
          "build_number": os.environ.get("BUILDKITE_BUILD_NUMBER"),
          "pipeline": os.environ.get("BUILDKITE_PIPELINE_SLUG"),
          "validation_contract": [
              "compileall:scripts-tests-skills",
              "validate_hierarchy",
              "validate_genius_mastery_bridge_freshness",
              "validate_deep_progress_latest",
              "proof_lease_near_expiry_check",
              "generate_mega_skill_pyramids_check",
              "unittest_discover",
              "local_skill_tests",
              "branch_lifecycle_tests",
              "mega_mission_receipt_hashes"
          ],
          "generated_at": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),
      }
      print(json.dumps(receipt, indent=2, sort_keys=True))
      PY
      TRANSIENT_RECEIPT=evidence/casebuilding-activation/test-dry-run-receipt.json
      changed="$(git diff --name-only)"
      unexpected="$(printf '%s\n' "$$changed" | grep -v '^$$' | grep -v "^$${TRANSIENT_RECEIPT}$$" || true)"
      if [ -n "$$unexpected" ]; then
        echo "Unexpected tracked mutations after validation:" >&2
        printf '%s\n' "$$unexpected" >&2
        exit 1
      fi
      if git diff --quiet -- "$$TRANSIENT_RECEIPT"; then
        echo "No transient dry-run receipt mutation observed."
      else
        cp "$$TRANSIENT_RECEIPT" artifacts/buildkite/test-dry-run-receipt.generated.json
        git checkout -- "$$TRANSIENT_RECEIPT"
      fi
      git diff --exit-code
    artifact_paths:
      - "/tmp/mega-skills-buildkite-run/**/*"
      - "artifacts/buildkite/mega-skills-ci-receipt.json"
      - "artifacts/buildkite/test-dry-run-receipt.generated.json"

  - label: ":compass: Harmonious Merge Watch (read-only)"
    key: "harmonious-merge-watch"
    timeout_in_minutes: 10
    command: |
      set -euo pipefail
      git fetch --quiet --prune origin \
        '+refs/heads/*:refs/remotes/origin/*' \
        '+refs/tags/*:refs/tags/*'
      python3 scripts/harmonious_merge_watch.py \
        --baseline main \
        --output .verification-artifacts/harmonious-merge-watch.json
      python3 - <<'PY'
      import json
      from pathlib import Path

      receipt = json.loads(Path(".verification-artifacts/harmonious-merge-watch.json").read_text())
      assert receipt["schema"] == "glaciereq.harmonious-merge-watch.v1"
      assert receipt["mode"] == "read_only"
      assert all(value is False for value in receipt["enforcement"].values() if isinstance(value, bool))
      assert receipt["baseline"]["name"] == "main"
      print("Verified read-only Harmonious Merge Watch receipt.")
      PY
    artifact_paths:
      - ".verification-artifacts/harmonious-merge-watch.json"

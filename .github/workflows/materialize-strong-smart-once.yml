name: Materialize Strong-Smart Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-strong-smart-once.yml"
      - "scripts/materialize_strong_smart_engine.py"
  pull_request:
    branches: [main]
    paths:
      - ".strong-smart-materialize-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-strong-smart-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Materialize exact-ID entries
        run: python scripts/materialize_strong_smart_engine.py
      - name: Regenerate recursive pyramid
        run: |
          python scripts/generate_mega_skill_pyramids.py
          python scripts/generate_mega_skill_pyramids.py --check
      - name: Validate hierarchy and executable kernel
        run: |
          python scripts/validate_hierarchy.py
          python tests/test_recursive_skill_hierarchy.py -v
          python -m unittest tests/test_strong_smart_routing_kernel.py
          python scripts/materialize_strong_smart_engine.py --check
      - name: Commit materialized registries and retire one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-strong-smart-once.yml
          git add registry/skills.json registry/combo-skills.json registry/mega-skills.json registry/pipelines.json registry/mega-skill-pyramids.json scripts/materialize_strong_smart_engine.py
          git diff --cached --quiet && exit 0
          git commit -m "registry: materialize APEX Strong-Smart Execution Engine"
          git push origin HEAD:main

name: Validate Mega Skills Hierarchy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate capability hierarchy
        run: python scripts/validate_hierarchy.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate local skill creator behavior
        run: python skills/local-skill/tests/test_local_skill.py -v
      - name: Validate branch lifecycle intelligence
        run: python skills/branch-lifecycle-intelligence/tests/test_branch_lifecycle.py -v

name: Materialize APEX Max Research Engine

on:
  push:
    branches:
      - feat/apex-max-research-engine-20260912
    paths:
      - registry/apex-max-research-engine.entries.json
      - scripts/materialize_apex_max_research_engine.py
      - .github/workflows/materialize-apex-max-research-engine.yml
      - mega-skills/apex-max-research-engine/MEGA.md
      - combo-skills/max-research-spiral/COMBO.md
      - combo-skills/diamond-research-topography/COMBO.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apex-max-research-engine-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize registries and validate pyramids
        run: python scripts/materialize_apex_max_research_engine.py
      - name: Commit generated registries
        run: |
          if git diff --quiet -- registry/mega-skills.json registry/combo-skills.json registry/mega-skill-pyramids.json; then
            echo "Canonical registries already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/mega-skills.json registry/combo-skills.json registry/mega-skill-pyramids.json
          git commit -m "Materialize APEX Max Research Engine registries"
          git push origin HEAD:feat/apex-max-research-engine-20260912

# Triggered after workflow registration; changes are idempotent and additive.

name: Runner Allocation Probe

on:
  push:
    paths:
      - '.github/workflows/runner-allocation-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: allocation-marker
        run: echo runner-assigned-ubuntu
  macos:
    runs-on: macos-latest
    timeout-minutes: 1
    steps:
      - name: allocation-marker
        run: echo runner-assigned-macos
  windows:
    runs-on: windows-latest
    timeout-minutes: 1
    steps:
      - name: allocation-marker
        run: echo runner-assigned-windows

name: Bootstrap Durable Pipeline Runtime

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-durable-pipeline.yml"

permissions:
  contents: write

concurrency:
  group: mega-skills-mutator
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure durable worker identity
        run: |
          git config user.name "GlacierEQ Pipeline Bootstrap"
          git config user.email "actions@users.noreply.github.com"

      - name: Reassemble and safely extract validated payload
        run: |
          cat .bootstrap/pipeline-payload.00               .bootstrap/pipeline-payload.01               .bootstrap/pipeline-payload.02               .bootstrap/pipeline-payload.03 > /tmp/pipeline-payload.b64
          base64 --decode /tmp/pipeline-payload.b64 > /tmp/pipeline-payload.tgz
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path("/tmp/pipeline-payload.tgz")
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              for member in members:
                  parts = Path(member.name).parts
                  if member.name.startswith("/") or ".." in parts:
                      raise SystemExit(f"unsafe archive member: {member.name}")
              tf.extractall(".")
              print(f"extracted {len(members)} durable pipeline files")
          PY

      - name: Verify implementation before persistence
        run: |
          python -m py_compile             skills/pipeline-compositor/scripts/engine.py             skills/pipeline-compositor/scripts/dag_parser.py             skills/pipeline-compositor/scripts/topology_validator.py             skills/pipeline-compositor/scripts/checkpoint_manager.py             skills/pipeline-compositor/scripts/stage_executor.py             skills/pipeline-compositor/scripts/backpressure_controller.py             skills/pipeline-compositor/scripts/manifest_synthesizer.py             skills/pipeline-compositor/scripts/run.py             scripts/target_role_evidence_projection.py
          python skills/pipeline-compositor/tests/test_pipeline_compositor.py
          python -m unittest discover -s tests -v
          python scripts/validate_hierarchy.py
          git diff --check

      - name: Execute Anthropic Applied AI durable pipeline
        run: |
          python skills/pipeline-compositor/scripts/run.py             --pipeline pipelines/anthropic-applied-ai-readiness.json             --workspace .             --state-dir missions/anthropic-applied-ai/state             --resume

      - name: Reconcile readiness after behavioral proof
        run: |
          python scripts/readiness_assay.py             --pass 2             --apply             --report missions/anthropic-applied-ai/readiness-after-bootstrap.json
          python scripts/validate_hierarchy.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Remove bootstrap transport
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-durable-pipeline.yml

      - name: Persist durable pipeline system
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No durable changes to persist."
          else
            git commit -m "pipeline: implement durable compositor and Anthropic readiness flow"
            git push origin HEAD:main
          fi

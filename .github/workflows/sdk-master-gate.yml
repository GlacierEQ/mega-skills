name: SDK Master acceptance gate
on:
  pull_request:
    paths:
      - 'skills/sdk-master/**'
      - '.github/workflows/sdk-master-gate.yml'
  push:
    paths:
      - 'skills/sdk-master/**'
      - '.github/workflows/sdk-master-gate.yml'
  workflow_dispatch:
    inputs:
      enforce_completion:
        description: 'Require operational mission completion receipt'
        type: boolean
        default: false
jobs:
  acceptance:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SDK Master tests
        run: python -m unittest discover -s skills/sdk-master/tests -v
      - name: Verify mission completion gate accepts
        run: |
          python skills/sdk-master/scripts/completion_gate.py skills/sdk-master/receipts/MISSION_STATE.json > /tmp/decision.json
          cat /tmp/decision.json
          python -c 'import json; d=json.load(open("/tmp/decision.json")); assert d["decision"] == "COMPLETE" and d["accepted"]'
      - name: Enforce actual mission completion on explicit dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_completion }}
        run: python skills/sdk-master/scripts/completion_gate.py skills/sdk-master/receipts/MISSION_STATE.json
